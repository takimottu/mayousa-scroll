<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Late Runner | まようさ遅刻中！-開演5分前-</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="game-column">
      <canvas id="game" width="360" height="640" aria-label="縦スクロールゲーム" role="img"></canvas>
      <div class="touch-controls" aria-label="タッチ操作">
        <button class="touch-button touch-start" type="button" data-action="start">START</button>
        <div class="touch-pad">
          <button class="touch-button" type="button" data-key="up" aria-label="上">↑</button>
          <button class="touch-button" type="button" data-key="left" aria-label="左">←</button>
          <button class="touch-button" type="button" data-key="down" aria-label="下">↓</button>
          <button class="touch-button" type="button" data-key="right" aria-label="右">→</button>
        </div>
      </div>
      <div class="help">
        <div class="keys">移動: WASD / 矢印キー　開始: Enter　リトライ: R　タイトル: T</div>
      </div>
    </div>
    <aside class="ranking-panel" aria-label="ランキング">
      <div class="ranking-head">
        <h1>Late Runnerランキング</h1>
        <button id="rankingRefresh" class="icon-button" type="button" aria-label="ランキングを更新">↻</button>
      </div>
      <div id="resultActions" class="result-actions" hidden>
        <div class="result-score">
          <span>今回のSCORE</span>
          <strong id="latestScore">0</strong>
        </div>
        <label class="name-field">
          <span>名前</span>
          <input id="playerName" type="text" maxlength="16" autocomplete="nickname" placeholder="まようさ" />
        </label>
        <label id="mayousaPicker" class="name-field mayousa-picker" hidden>
          <span>推しまようさ</span>
          <select id="shareMayousa">
            <option value="hat">まようさハット</option>
            <option value="glasses">まようさグラサン</option>
            <option value="flower">まようさおはな</option>
            <option value="apple">まようさりんご</option>
            <option value="ribbon">まようさりぼん</option>
          </select>
        </label>
        <div class="action-row">
          <button id="submitScore" class="primary-button" type="button">ランキング登録</button>
          <button id="shareScore" class="secondary-button" type="button">ポスト</button>
        </div>
        <button id="shareImageScore" class="secondary-button wide-button" type="button" hidden>リザルト画像を表示</button>
        <div id="resultImagePreview" class="result-image-preview" hidden>
          <img id="resultImage" alt="ポスト用リザルト画像" />
          <span>画像を長押し/右クリックで保存して、ポストに添付してください。</span>
        </div>
        <p id="resultMessage" class="panel-message"></p>
      </div>
      <ol id="rankingList" class="ranking-list"></ol>
      <p id="rankingStatus" class="panel-message">ランキング読込中...</p>
    </aside>
  </div>
  <script src="leaderboard-config.js"></script>
  <script src="game.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
